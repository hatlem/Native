name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atnative
          POSTGRES_PASSWORD: atnative
          POSTGRES_DB: atnative
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atnative"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://atnative:atnative@127.0.0.1:5432/atnative?schema=public"
      AUTH_SECRET: "ci-test-secret"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm prisma generate

      - run: pnpm prisma migrate deploy

      - run: pnpm db:seed

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      # DB-backed integration tests (*.it.test.ts) — they need the seeded
      # Postgres service above + ALLOW_LOCAL_DB=1 (set by the test:it script).
      # RUN_DB_IT=1 un-gates the 7 heavier suites (checkout / content-fee /
      # api-contract / auth-tokens / campaign / contact-log / ratecard) and the
      # saved-list flow test that self-skip otherwise — safe here because the
      # postgres service + db:seed above is a fresh disposable DB every run.
      # (store.it.test.ts's R2 round-trip still self-skips without R2_* creds.)
      - run: pnpm test:it
        env:
          RUN_DB_IT: "1"

      - run: pnpm build
